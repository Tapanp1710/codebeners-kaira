# KAIRA monorepo workflow: .github/workflows/frontend.yml
# Derived 1:1 from kaira-frontend/.github/workflows/ci.yml (frontend ref 9114fb9). Every check is kept;
# only paths changed: run steps execute in kaira-frontend/, npm cache and artifact paths point there.
name: frontend-ci

# Push to main: ALWAYS runs (no path filter), so main is checked even when only the backend changed.
# Push to feat/**: runs only when kaira-frontend/** or this file changed (decided by the `changes` job below,
# because GitHub's push `paths` filter cannot be limited to some branches).
# Pull requests: native path filter.
# The self-contained end-to-end suite (own PostgreSQL + backend, no secrets) lives in e2e.yml.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    paths:
      - "kaira-frontend/**"
      - ".github/workflows/frontend.yml"
  # Called by full-suite.yml (always runs every check).
  workflow_call:
  # Manual full run, e.g. when a path-filtered run was skipped but a check is required.
  workflow_dispatch:

# Least privilege: the workflow token can only read repository contents.
permissions:
  contents: read

defaults:
  run:
    working-directory: kaira-frontend

jobs:
  # Path gate. pull_request uses GitHub's native `paths` filter above. push cannot path-filter per branch, so
  # this job decides: pushes to main ALWAYS run; pushes to other branches run only when a file matching
  # PATTERN changed (a new branch, force push or unknown base runs everything). workflow_call and
  # workflow_dispatch always run.
  changes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PATTERN: '^(kaira-frontend/|\.github/workflows/frontend\.yml$)'
        run: |
          if [ "$EVENT" != "push" ] || [ "$REF" = "refs/heads/main" ]; then
            run=true; why="$EVENT on $REF always runs"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            run=true; why="no usable base commit; running everything"
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -Eq "$PATTERN"; then
            run=true; why="relevant files changed"
          else
            run=false; why="no file matching $PATTERN changed"
          fi
          echo "frontend-ci: run=$run ($why)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # Gate job: the docker and e2e jobs both depend on it (needs: checks).
  checks:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # setup-node looks for a lockfile at the workspace root unless told otherwise.
          cache-dependency-path: kaira-frontend/package-lock.json
      # Exact install from package-lock.json.
      - run: npm ci --no-audit --no-fund
      # Validates the committed .env.example as if it were .env.local.
      - name: Environment template is valid
        run: cp .env.example .env.local && node scripts/check-env.mjs
      # No BACKEND_ORIGIN is set in this job, so the live-backend comparison is skipped; spec hash and generated types must still match.
      - name: Contract and generated types are consistent
        run: node scripts/contract.mjs check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Fails on high or critical advisories in runtime dependencies only; devDependencies are excluded.
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  # Proves the production image builds; it is neither run nor pushed here.
  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kaira-frontend:ci .

  # Optional extra: the same Playwright suite against a configured STAGING backend. The always-on, secret-free
  # end-to-end run against a backend started inside the job is e2e.yml.
  e2e:
    runs-on: ubuntu-latest
    needs: checks
    # Runs only when the repository variable E2E_BACKEND_ORIGIN is set; otherwise the job is skipped, not failed.
    if: ${{ vars.E2E_BACKEND_ORIGIN != '' }}
    env:
      BACKEND_ORIGIN: ${{ vars.E2E_BACKEND_ORIGIN }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kaira-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts starts `next start` itself, so a production build must exist first.
      - run: npm run build
      - run: npx playwright test
      # actions/* `with.path` is NOT affected by defaults.run.working-directory: give the repo-relative path.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: kaira-frontend/playwright-report

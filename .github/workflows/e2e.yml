# KAIRA monorepo workflow: .github/workflows/e2e.yml
# Self-contained end-to-end run that needs NO repository secrets or variables:
#   PostgreSQL service -> backend from backend/requirements-dev.txt -> migrate + seed (demo owner) -> staff user via
#   `python -m app.cli create-user` -> uvicorn on 127.0.0.1:8000 -> production frontend build -> Playwright
#   (kaira-frontend/playwright.config.ts starts `next start` on E2E_PORT and points it at BACKEND_ORIGIN).
# Every password and the JWT secret are generated randomly inside the job and masked in the log.
# There is no Sarvam key in CI: AI extraction falls back to the deterministic rules provider, and specs that need
# the live agent LLM skip themselves unless E2E_LIVE_AGENT=1 (deliberately NOT set here).
name: e2e

# Push to main: ALWAYS runs. Push to feat/**: runs only when backend/**, kaira-frontend/** or this file changed
# (decided by the `changes` job). Pull requests: native path filter. full-suite.yml calls it via workflow_call.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    paths:
      - "backend/**"
      - "kaira-frontend/**"
      - ".github/workflows/e2e.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Path gate: see backend.yml for the rules (main and non-push events always run).
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PATTERN: '^(backend/|kaira-frontend/|\.github/workflows/e2e\.yml$)'
        run: |
          if [ "$EVENT" != "push" ] || [ "$REF" = "refs/heads/main" ]; then
            run=true; why="$EVENT on $REF always runs"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            run=true; why="no usable base commit; running everything"
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -Eq "$PATTERN"; then
            run=true; why="relevant files changed"
          else
            run=false; why="no file matching $PATTERN changed"
          fi
          echo "e2e: run=$run ($why)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kaira
          # Throwaway service container reachable only from this job; not a secret.
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: kaira_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaira" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Backend (read by app.core.config; there is no backend/.env in CI).
      APP_ENV: test
      LOG_FORMAT: text
      DATABASE_URL: postgresql+psycopg://kaira:ci_password@127.0.0.1:5432/kaira_e2e
      DEMO_OWNER_EMAIL: demo@kaira.local
      # The browser talks to the Next server on E2E_PORT; the live-agent WebSocket goes to the backend directly and
      # its Origin is checked against CORS_ORIGINS.
      FRONTEND_ORIGIN: http://127.0.0.1:3100
      CORS_ORIGINS: http://127.0.0.1:3100,http://localhost:3100
      AGENT_PUBLIC_WS_URL: ws://127.0.0.1:8000/api/v1/agent/live
      # Disposable single-run backend: the suite signs in through the UI once per test (all from 127.0.0.1 with the
      # same e-mail). The login limiter itself is covered by backend pytest; here it must not throttle the suite.
      RATE_LIMIT_LOGIN_PER_MINUTE: "120"
      # Frontend / Playwright (names from kaira-frontend/playwright.config.ts and kaira-frontend/e2e/*.ts).
      E2E_PORT: "3100"
      BACKEND_ORIGIN: http://127.0.0.1:8000
      E2E_EMAIL: demo@kaira.local
      E2E_STAFF_EMAIL: e2e-staff@kaira.local
      E2E_DISPOSABLE_BACKEND: "1"
      RUN_ACCEPTANCE: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kaira-frontend/package-lock.json

      # Random per-run credentials, masked before they are exported. Only [A-Za-z0-9_-] characters.
      - name: Generate per-run credentials
        run: |
          gen() { python3 -c "import secrets, sys; print(secrets.token_urlsafe(int(sys.argv[1])))" "$1"; }
          owner_pw="$(gen 24)"; staff_pw="$(gen 24)"; jwt="$(gen 48)"
          echo "::add-mask::$owner_pw"; echo "::add-mask::$staff_pw"; echo "::add-mask::$jwt"
          {
            echo "DEMO_OWNER_PASSWORD=$owner_pw"
            echo "E2E_PASSWORD=$owner_pw"
            echo "KAIRA_USER_PASSWORD=$staff_pw"
            echo "E2E_STAFF_PASSWORD=$staff_pw"
            echo "JWT_SECRET_KEY=$jwt"
          } >> "$GITHUB_ENV"

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Backend configuration is valid
        working-directory: backend
        run: python -m app.cli check-config
      - name: Migrate
        working-directory: backend
        run: python -m app.cli wait-db --timeout 60 && python -m app.cli migrate
      - name: Seed demo business (owner = E2E_EMAIL, password = DEMO_OWNER_PASSWORD)
        working-directory: backend
        run: python -m app.cli seed
      - name: Create staff user (password from KAIRA_USER_PASSWORD)
        working-directory: backend
        run: python -m app.cli create-user --owner-email "$E2E_EMAIL" --email "$E2E_STAFF_EMAIL" --name "E2E Staff" --role staff

      - name: Start backend on 127.0.0.1:8000
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ready > /dev/null; then echo "Backend ready"; exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null; then
              echo "::error::uvicorn exited during startup"; cat "$RUNNER_TEMP/backend.log"; exit 1
            fi
            sleep 2
          done
          echo "::error::Backend did not become ready within 120 s"; cat "$RUNNER_TEMP/backend.log"; exit 1

      - name: Install frontend
        working-directory: kaira-frontend
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: kaira-frontend
        run: npx playwright install --with-deps chromium
      # playwright.config.ts runs `next start` itself, so a production build must exist first.
      # Backend-only secrets are removed from the frontend processes' environment (the Next server never needs them).
      - name: Build frontend
        working-directory: kaira-frontend
        run: env -u JWT_SECRET_KEY -u DATABASE_URL -u DEMO_OWNER_PASSWORD -u KAIRA_USER_PASSWORD npm run build
      - name: Frontend reaches the backend
        working-directory: kaira-frontend
        run: node scripts/check-env.mjs --connect
      - name: Playwright end-to-end suite
        working-directory: kaira-frontend
        run: env -u JWT_SECRET_KEY -u DATABASE_URL -u DEMO_OWNER_PASSWORD -u KAIRA_USER_PASSWORD npx playwright test

      - name: Stop backend
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true; fi
          # Copied into the workspace for the failure artifact. All credentials are per-run and die with the job.
          if [ -f "$RUNNER_TEMP/backend.log" ]; then cp "$RUNNER_TEMP/backend.log" backend-e2e.log; fi
      # actions/* `with.path` is repo-relative and ignores working-directory.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: e2e-playwright-report
          path: |
            kaira-frontend/playwright-report
            kaira-frontend/test-results
            backend-e2e.log
          if-no-files-found: ignore
          retention-days: 14

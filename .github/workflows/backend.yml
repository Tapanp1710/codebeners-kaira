# KAIRA monorepo workflow: .github/workflows/backend.yml
# Derived 1:1 from backend/.github/workflows/ci.yml (backend ref 5f5d80c). Every check is kept;
# only paths changed: run steps execute in backend/, cache key and Docker context point at backend/.
name: backend-ci

# Push to main: ALWAYS runs (no path filter), so main is checked even when only the frontend changed.
# Push to feat/**: runs only when backend/** or this file changed (decided by the `changes` job below,
# because GitHub's push `paths` filter cannot be limited to some branches).
# Pull requests: native path filter.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  # Called by backend-deploy.yml before any deployment and by full-suite.yml (always runs every check).
  workflow_call:
  # Manual full run, e.g. when a path-filtered run was skipped but a check is required.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  # Path gate. pull_request uses GitHub's native `paths` filter above. push cannot path-filter per branch, so
  # this job decides: pushes to main ALWAYS run; pushes to other branches run only when a file matching
  # PATTERN changed (a new branch, force push or unknown base runs everything). workflow_call and
  # workflow_dispatch always run.
  changes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PATTERN: '^(backend/|\.github/workflows/backend\.yml$)'
        run: |
          if [ "$EVENT" != "push" ] || [ "$REF" = "refs/heads/main" ]; then
            run=true; why="$EVENT on $REF always runs"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            run=true; why="no usable base commit; running everything"
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -Eq "$PATTERN"; then
            run=true; why="relevant files changed"
          else
            run=false; why="no file matching $PATTERN changed"
          fi
          echo "backend-ci: run=$run ($why)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kaira
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: kaira
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaira" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://kaira:ci_password@127.0.0.1:5432/kaira
      TEST_DATABASE_URL: postgresql+psycopg://kaira:ci_password@127.0.0.1:5432/kaira_test
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Resolved from the workspace root, not from defaults.run.working-directory.
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Create test database
        run: PGPASSWORD=ci_password psql -h 127.0.0.1 -U kaira -d kaira -c "CREATE DATABASE kaira_test"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Migrations apply cleanly
        run: python -m app.cli migrate
      - name: Models match migrations
        run: python -m alembic check
      - name: Migration downgrade/upgrade round trip
        run: python -m alembic downgrade base && python -m alembic upgrade head
      - name: OpenAPI contract is current
        run: |
          python -m app.cli export-openapi /tmp/openapi.json
          diff -u docs/openapi.json /tmp/openapi.json
      - name: Tests (PostgreSQL)
        run: python -m pytest -q
      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t kaira-backend:ci .
      - name: Container refuses insecure production config
        run: |
          set +e
          docker run --rm --entrypoint python -e APP_ENV=production kaira-backend:ci -m app.cli check-config
          test $? -ne 0

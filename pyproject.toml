[project]
name = "kaira-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is enforced by `ruff format`; long regexes and prompt strings are allowed.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]

